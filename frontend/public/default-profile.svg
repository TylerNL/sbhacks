<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Default outlined profile">
  <!-- Orange outlined profile icon -->
  <defs>
    <style>
      .stroke { stroke: #fb923c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- Outer circle outline -->
  <circle cx="50" cy="50" r="42" class="stroke" />

  <!-- Head -->
  <circle cx="50" cy="36" r="12" class="stroke" />

  <!-- Shoulders / torso -->
  <path d="M30 74c6-10 14-16 20-16s14 6 20 16" class="stroke" />
</svg>